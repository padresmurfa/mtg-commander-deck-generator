# Serves the JSON files produced by the tagger-sync / spellchroma-index jobs (see
# docker/data-sync/) from a local volume, standing in for the public S3 bucket those jobs
# used to upload to. CORS is wide open since this only ever runs on localhost.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    gzip on;
    gzip_types application/json;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
