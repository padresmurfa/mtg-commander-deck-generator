# Serves the production build of the SPA, mirroring the SPA-fallback behavior that
# infra/lib/site-stack.ts gets from CloudFront's 403/404 -> /index.html error responses.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell so a new deploy is picked up on next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints built assets, so these are safe to cache aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
