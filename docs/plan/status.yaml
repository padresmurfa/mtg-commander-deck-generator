# Deck simulator & optimiser — implementation plan, machine-readable
#
# Companion to docs/simulator-plan.md (narrative). This file is the living status
# skeleton: epics, sprints, gates, and the task split of the CURRENT sprint only.
#
# Update contract:
#   - epics/sprints: fixed up front; `status` changes, structure does not
#   - `current_sprint`: advanced at each retro
#   - `tasks`: replaced wholesale at each sprint planning; only ever the current sprint
#   - `retros`: appended at each retro; never edited in place
#
# See docs/simulator-design.md for reasoning, docs/simulator-spec.yaml for values.

meta:
  status: in_progress
  current_sprint: "3.2"
  task_split_valid_for: "3.2"     # task-splitting any other sprint is speculative
  baseline: greenfield
  language: c
  deliverable: cli

# ---------------------------------------------------------------------------
# What survives from the existing TypeScript app. Reference only, not a foundation.
# ---------------------------------------------------------------------------
baseline_disposition:
  keep_as_reference:
    - path: src/services/scryfall/
      why: acquisition logic ported in E1
    - path: src/services/edhrec/
      why: acquisition logic ported in E1
    - path: src/services/tagger/
      why: role tags feed skill floors (spec ref 7.4)
    - path: src/services/deckBuilder/deckAnalyzer.ts
      why: hypergeometric functions are the analytic validation oracle (spec ref 13.1)
  delete:
    - src/components/
    - src/pages/
    - src/store/
    - infra/
  not_part_of_project:
    - docker/mock-api/
    - docker-compose.yml MSSQL services
  note: Git history preserves everything; deletion is safe.

# ---------------------------------------------------------------------------
# Process. Three levels, asymmetric detail by design.
# ---------------------------------------------------------------------------
process:
  levels:
    epics:
      decided: up_front
      mutable: false
      detail: goal + sprint split
    sprints:
      decided: up_front
      detail: goal + exit criteria
      tasks_included: false
    tasks:
      decided: at_sprint_start
      detail: full split, each with a checkable definition of done
      rule: only the current sprint is ever task-split
      why: >
        Task-splitting a future sprint is speculative work that the intervening retro
        would invalidate.
  cycle: [sprint_planning, implementation, retro]
  sprint_planning:
    inputs: [sprint_exit_criteria, previous_retro_output]
    output: task list with checkable definitions of done
  retro:
    outputs:
      - id: delivered_vs_exit_criteria
        note: Includes what was NOT delivered, explicitly.
      - id: design_amendments
        note: >
          Where reality contradicted simulator-design.md or simulator-spec.yaml, both are
          corrected in the same pass. A design of record that drifts is worse than none.
      - id: revised_risks
        note: What got scarier, what stopped mattering.
      - id: carry_over
        note: Work moving into the next sprint, with the reason.
    feeds: next_sprint_planning

# ---------------------------------------------------------------------------
# Go/no-go gates. Placed as early as the dependency graph allows.
# ---------------------------------------------------------------------------
gates:
  - id: G1
    sprint: "1.2"
    name: opcode_coverage
    question: Can the opcode set represent enough of a real candidate pool?
    threshold: ">= 0.60 sound; <= 0.30 compromised"
    spec_ref: "13.5"
    on_failure: grow the opcode set, or stop
    result: "pass - 0.9301, inert 90.33% (re-measured 3.1, superseding 0.9325 and 0.9357)"

  - id: G2
    sprint: "2.1"
    name: analytic_agreement
    question: Does the sampler converge to closed-form hypergeometric truth?
    spec_ref: "13.1"
    on_failure: the simulation core is wrong; fix before anything builds on it
    result: "pass - worst cell 2.43 sigma against a 5 sigma tolerance fixed in advance (2.1)"
  - id: G3
    sprint: "2.3"
    name: policy_gap_discriminates
    question: Does naive-vs-careful separate known-forgiving from known-demanding decks?
    spec_ref: "5"
    on_failure: the skill ladder is unfounded; redesign section 5
    result: >
      defer (2.3, gate pass rate) then FAIL (3.1, continuous score, -2.28 sigma). The failure branch
      was engaged and NOT taken: section 5 separates the decks perfectly at every horizon, and what
      fails is measuring it against a SOLO objective at all. Moved to E5, where an opponent supplies
      the clock a tempo signal needs.
  - id: G4
    sprint: "3.3"
    name: precon_rank_correlation
    question: Does the objective rank real decks in the right order?
    method: spearman on precons with n >= 100
    spec_ref: "13.2"
    on_failure: the objective is wrong; redesign section 3
  - id: G5
    sprint: "4.3"
    name: ga_beats_greedy
    question: Is the landscape optimisable by population methods?
    threshold: margin exceeding the GA's own noise
    spec_ref: "12"
    on_failure: ship greedy; drop the GA

