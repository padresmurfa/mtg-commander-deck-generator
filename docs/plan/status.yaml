# Deck simulator & optimiser — implementation plan, machine-readable
#
# Companion to docs/simulator-plan.md (narrative). This file is the living status
# skeleton: epics, sprints, gates, and the task split of the CURRENT sprint only.
#
# Update contract:
#   - epics/sprints: fixed up front; `status` changes, structure does not
#   - `current_sprint`: advanced at each retro
#   - `tasks`: replaced wholesale at each sprint planning; only ever the current sprint
#   - `retros`: appended at each retro; never edited in place
#
# See docs/simulator-design.md for reasoning, docs/simulator-spec.yaml for values.

meta:
  status: in_progress
  current_sprint: "1.1"
  task_split_valid_for: "1.1"     # task-splitting any other sprint is speculative
  baseline: greenfield
  language: c
  deliverable: cli

# ---------------------------------------------------------------------------
# What survives from the existing TypeScript app. Reference only, not a foundation.
# ---------------------------------------------------------------------------
baseline_disposition:
  keep_as_reference:
    - path: src/services/scryfall/
      why: acquisition logic ported in E1
    - path: src/services/edhrec/
      why: acquisition logic ported in E1
    - path: src/services/tagger/
      why: role tags feed skill floors (spec ref 7.4)
    - path: src/services/deckBuilder/deckAnalyzer.ts
      why: hypergeometric functions are the analytic validation oracle (spec ref 13.1)
  delete:
    - src/components/
    - src/pages/
    - src/store/
    - infra/
  not_part_of_project:
    - docker/mock-api/
    - docker-compose.yml MSSQL services
  note: Git history preserves everything; deletion is safe.

# ---------------------------------------------------------------------------
# Process. Three levels, asymmetric detail by design.
# ---------------------------------------------------------------------------
process:
  levels:
    epics:
      decided: up_front
      mutable: false
      detail: goal + sprint split
    sprints:
      decided: up_front
      detail: goal + exit criteria
      tasks_included: false
    tasks:
      decided: at_sprint_start
      detail: full split, each with a checkable definition of done
      rule: only the current sprint is ever task-split
      why: >
        Task-splitting a future sprint is speculative work that the intervening retro
        would invalidate.
  cycle: [sprint_planning, implementation, retro]
  sprint_planning:
    inputs: [sprint_exit_criteria, previous_retro_output]
    output: task list with checkable definitions of done
  retro:
    outputs:
      - id: delivered_vs_exit_criteria
        note: Includes what was NOT delivered, explicitly.
      - id: design_amendments
        note: >
          Where reality contradicted simulator-design.md or simulator-spec.yaml, both are
          corrected in the same pass. A design of record that drifts is worse than none.
      - id: revised_risks
        note: What got scarier, what stopped mattering.
      - id: carry_over
        note: Work moving into the next sprint, with the reason.
    feeds: next_sprint_planning

# ---------------------------------------------------------------------------
# Go/no-go gates. Placed as early as the dependency graph allows.
# ---------------------------------------------------------------------------
gates:
  - id: G1
    sprint: "1.2"
    name: opcode_coverage
    question: Can the opcode set represent enough of a real candidate pool?
    threshold: ">= 0.60 sound; <= 0.30 compromised"
    spec_ref: "13.5"
    on_failure: grow the opcode set, or stop
  - id: G2
    sprint: "2.1"
    name: analytic_agreement
    question: Does the sampler converge to closed-form hypergeometric truth?
    spec_ref: "13.1"
    on_failure: the simulation core is wrong; fix before anything builds on it
  - id: G3
    sprint: "2.3"
    name: policy_gap_discriminates
    question: Does naive-vs-careful separate known-forgiving from known-demanding decks?
    spec_ref: "5"
    on_failure: the skill ladder is unfounded; redesign section 5
  - id: G4
    sprint: "3.3"
    name: precon_rank_correlation
    question: Does the objective rank real decks in the right order?
    method: spearman on precons with n >= 100
    spec_ref: "13.2"
    on_failure: the objective is wrong; redesign section 3
  - id: G5
    sprint: "4.3"
    name: ga_beats_greedy
    question: Is the landscape optimisable by population methods?
    threshold: margin exceeding the GA's own noise
    spec_ref: "12"
    on_failure: ship greedy; drop the GA

# ---------------------------------------------------------------------------
# Epics. Fixed. Sprint-split, not task-split.
# ---------------------------------------------------------------------------
epics:
  - id: E0
    name: Foundations
    status: done
    note: >
      Determinism is built before there is anything to be deterministic about, deliberately.
      Retrofitting means auditing every accumulator written in the meantime.
    sprints:
      - id: "0.1"
        name: Greenfield skeleton
        status: done
        retro: docs/plan/retros/0.1-greenfield-skeleton.md
        result:
          checks: 1409
          line_coverage: 100.00
          branch_coverage: 97.14
          function_coverage: 100.00
        exit_criteria:
          - repo reset to greenfield
          - make builds a binary
          - subcommand shell dispatches
          - config loads
          - JSONL artifact writes
          - one test passes under make test
      - id: "0.2"
        name: Memory & process model
        status: done
        retro: docs/plan/retros/0.2-memory-process-model.md
        result:
          checks: 1661
          line_coverage: 100.00
          branch_coverage: 97.16
          function_coverage: 100.00
        tasks_doc: docs/plan/sprints/0.2-memory-process-model.md
        inserted_after: "0.1"
        why_inserted: >
          The memory model changes what every later module allocates from, and 0.3 pins output with
          golden files. Memory after determinism would mean regenerating every golden file the
          moment it was written.
        exit_criteria:
          - no libc allocation outside the memory layer
          - every module allocates from a caller-supplied arena
          - environmental failure exits with a distinct code and a machine-readable report
          - arena stack frames release in O(1) and restore the zero guarantee
          - orchestrator relaunches the worker at a larger arena size and persists it
      - id: "0.2.1"
        name: Pool discipline & alignment
        status: done
        retro: docs/plan/retros/0.2.1-pool-discipline.md
        result:
          checks: 1754
          line_coverage: 100.00
          branch_coverage: 97.00
          function_coverage: 100.00
        tasks_doc: docs/plan/sprints/0.2.1-pool-discipline.md
        inserted_after: "0.2"
        why_inserted: >
          A follow-on to 0.2, not a reopening of it: 0.2 is done and its retro is written, and
          correcting that record in place would destroy it. The pool's contract inverted, so the
          same ordering argument applies — changing it under a golden file would mean regenerating
          the golden file.
        exit_criteria:
          - a pool holds exactly depth arenas and never creates another
          - exhausting a pool exits 73 with a report naming the pool, its depth and its kind
          - stack pools reject an out-of-order release; heap pools accept one
          - the orchestrator grows the depth the report names, and persists it
          - mf_arena_alloc_aligned rejects an alignment it cannot honour
      - id: "0.3"
        name: Determinism harness
        status: done
        retro: docs/plan/retros/0.3-determinism-harness.md
        result:
          checks: 2653
          line_coverage: 100.00
          branch_coverage: 97.25
          function_coverage: 100.00
        tasks_doc: docs/plan/sprints/0.3-determinism-harness.md
        exit_criteria:
          - counter-based RNG
          - layered digest emission
          - golden-file comparison
          - 6-way matrix (threads x fresh/resumed) passes on a trivial workload

  - id: E1
    name: Card pipeline
    status: active
    subcommand: preprocess
    sprints:
      - id: "1.1"
        name: Acquisition & oracle normalisation
        status: planned
        tasks_doc: docs/plan/sprints/1.1-acquisition.md
        exit_criteria:
          - Scryfall bulk ingested
          - grouped by oracle_id
          - min price across paper non-foil printings
          - legality and colour identity resolved
      - id: "1.2"
        name: Opcode model
        status: not_started
        gate: G1
        exit_criteria:
          - card struct <= 32 bytes
          - oracle text mapped to opcodes for the modelled subset
          - coverage measured on a real commander's pool
      - id: "1.3"
        name: Classes, dominance, enrichment
        status: not_started
        exit_criteria:
          - equivalence classes
          - dominance chains merged into tiered classes
          - skill floors assigned
          - precon membership bitmask
          - price imputation via dominance
          - binary card table emitted with content hash

  - id: E2
    name: Opening phase
    status: not_started
    sprints:
      - id: "2.1"
        name: Shuffle, draw, mulligan
        status: not_started
        gate: G2
        exit_criteria:
          - unbiased Fisher-Yates
          - London mulligan with per-policy keep and bottom rules
          - Monte Carlo agrees with hypergeometric closed forms
      - id: "2.2"
        name: Exact turns 1-4
        status: not_started
        exit_criteria:
          - land drops, mana availability, castability, sequencing
          - end-of-phase state vector produced
      - id: "2.3"
        name: Policies & policy gap
        status: not_started
        gate: G3
        exit_criteria:
          - greedy and careful policies implemented
          - gap measured
          - known-forgiving and known-demanding decks separate

  - id: E3
    name: Solo evaluation
    status: not_started
    sprints:
      - id: "3.1"
        name: Aggregate phases 5+
        status: not_started
        exit_criteria:
          - development and execution phases in aggregate
          - full solo run produces a phase-end state
      - id: "3.2"
        name: Objective & sampling
        status: not_started
        exit_criteria:
          - per-strategy scalarisation
          - "mean + lambda * CVaR_10"
          - stratified openers under Neyman allocation
          - solo gate wired as pass/fail
      - id: "3.3"
        name: Fixture validation
        status: not_started
        gate: G4
        exit_criteria:
          - precon tables transcribed
          - Spearman rank correlation above threshold on n>=100 precons
          - synthetic known-bad decks ranked correctly

  - id: E4
    name: Search
    status: not_started
    note: >
      Built against SOLO fitness deliberately — it is 10-100x faster than gauntlet fitness, so
      the search machinery is derisked on a cheap objective. Swapping in gauntlet fitness later
      is a fitness change, not a search rewrite.
    sprints:
      - id: "4.1"
        name: Genome, constraints, mana solver
        status: not_started
        exit_criteria:
          - integer vector over metacard classes
          - singleton/multiplicity/cost constraints enforced
          - Karsten-based mana base solver replaces land search
      - id: "4.2"
        name: Greedy baseline
        status: not_started
        exit_criteria:
          - marginal-contribution forward selection
          - backward elimination
          - produces a legal, scored deck
      - id: "4.3"
        name: Genetic algorithm
        status: not_started
        gate: G5
        exit_criteria:
          - package-aware crossover over synergy-graph components
          - elite re-evaluation with fresh seeds
          - diversity niching by strategy
          - racing and adaptive sampling
          - GA beats greedy by a margin exceeding its own noise

  - id: E5
    name: Two-player
    status: not_started
    sprints:
      - id: "5.1"
        name: Gauntlet & matchups
        status: not_started
        exit_criteria:
          - opponent decks generated per archetype
          - matchups banded to same-bracket +/- 1
          - common random numbers applied across the gauntlet
      - id: "5.2"
        name: Bracket-relative fitness & holdout
        status: not_started
        exit_criteria:
          - train/test gauntlet split
          - overfitting visible as train-test divergence
          - fitness marked bracket-scoped so nothing averages across brackets

  - id: E6
    name: Operations & scale
    status: not_started
    note: Deferred until runs are long enough to need it.
    sprints:
      - id: "6.1"
        name: Threading
        status: not_started
        exit_criteria:
          - thread pool with configurable count
          - QoS set to USER_INITIATED
          - per-thread arenas
          - lock-free per-game path verified
          - determinism matrix passes at 1/4/8 threads
      - id: "6.2"
        name: Checkpoint & resume
        status: not_started
        exit_criteria:
          - atomic write/retain/restore
          - card-table hash validated on resume
          - SIGINT/SIGTERM checkpoint cleanly
          - resumed run bit-identical to uninterrupted
      - id: "6.3"
        name: Power & performance
        status: not_started
        exit_criteria:
          - sleep assertion held for run duration
          - LPM detect/pause/backoff
          - SoA layout for per-game mutable state
          - hot working set measured L1-resident
          - syscalls per generation confirmed O(1)

  - id: E7
    name: Brackets & close
    status: not_started
    sprints:
      - id: "7.1"
        name: Skill brackets end-to-end
        status: not_started
        exit_criteria:
          - all five policy sets
          - per-bracket colour, radius, budget bounds
          - precon seeding for low brackets
          - per-bracket output selection and cardinality
      - id: "7.2"
        name: Forge validation & docs
        status: not_started
        exit_criteria:
          - top-K decks validated against Forge (optional)
          - full validation suite consolidated
          - docs current

# ---------------------------------------------------------------------------
# CURRENT SPRINT TASK SPLIT. Replaced wholesale at each sprint planning.
# ---------------------------------------------------------------------------
tasks:
  sprint: "1.1"
  doc: docs/plan/sprints/1.1-acquisition.md
  goal: >
    Scryfall bulk data normalised into an oracle_id-keyed card set with resolved legality, colour
    identity and a minimum paper price. The input every later epic treats as given.
  why_now: >
    E0 is finished and the determinism harness has nothing but a stand-in to measure. This is the
    first sprint that produces something real, and G1 in 1.2 cannot be asked until there is a real
    card pool to ask it about.
  decisions:
    - id: preprocessing_language
      decided: c
      why: >
        A second toolchain is a second thing to install, pin and keep deterministic. The only
        argument for Node was that a Node app existed around the project; sprint 0.1 removed it.
        Design §8 amended in the same change, with the superseded paragraph quoted rather than
        rewritten.
    - id: fetch_or_consume
      decided: consume
      why: >
        The card table is an input to a deterministic core, so a subcommand that downloaded would
        condition the determinism invariant on the network and on the day it ran.
      invocation: "mfsim preprocess --bulk <file>"
    - id: reading_strategy
      decided: stream one array element at a time
      why: >
        ~110,000 printings and several hundred megabytes. A parsed document would cost gigabytes
        for a result read once, field by field, and discarded.
    - id: price_representation
      decided: integer cents
      why: exact, order-independent to sum, and no float comparison in a bit-identical pipeline
    - id: legality_disagreement
      decided: legal if any paper printing says so; count the disagreements
      why: >
        Legality is a property of the oracle card, so a disagreement is a stale record rather than
        a real distinction. The count goes in the run artifact so a non-zero one is noticed.
  list:
    - id: T0
      name: Apply the two decisions to the design of record
      done_when: [design §8 and a new spec preprocessing block agree with each other and with the build]
      note: First, not last — every task below contradicted §8 as it stood.
    - id: T1
      name: "mf/jstream: one value at a time out of a huge array"
      done_when:
        - the arena high-water mark is bounded by the largest element, not by the file
        - braces, brackets and escaped quotes inside strings do not confuse the scanner
        - a truncated array is an mf_err, not a crash
        - an element larger than the buffer still works
    - id: T2
      name: "mf/scryfall: one bulk object to one printing"
      done_when:
        - every field is read, and a missing or wrongly-typed field rejects the printing with a reason
        - the module has no opinion about merging
    - id: T3
      name: "mf/cards: the merge rules"
      done_when:
        - every rule has a test that fails when the rule is inverted
        - an oracle with no priced printing is flagged rather than priced at zero
        - the merge is testable without any JSON
    - id: T4
      name: "Normalisation: mana pips, type bitmask, CMC"
      done_when:
        - hybrid, Phyrexian, X and colourless pips are each a decided case with a test
        - a type line with a subtype section parses the same as one without
    - id: T5
      name: Deterministic emission and content hash
      done_when:
        - shuffling the input order leaves the output and the digest byte-identical
        - the golden file gains a row
    - id: T6
      name: "mfsim preprocess --bulk, end to end"
      done_when:
        - a fixture with the awkward cases runs end to end in a real process
        - a missing --bulk is a usage error rather than a crash
    - id: T7
      name: Retro and amendments
      done_when: [retro filed, design and spec amended in the same change, status advanced]
      note: >
        Deleting reference/legacy-ts/ belongs to the E1 retro, not this one — EDHREC and Tagger are
        still unported.
  input_from_previous_retro:
    - >
      The determinism harness is calibrated but unproven — the six-way matrix runs against mf/trial,
      which has no game semantics. The card table is the first real data to reach the digest layers.
    - A covered branch is not a tested branch. A parser is mostly branches, so the coverage number
      will look reassuring long before the tests are. Budget for mutation testing.
    - Mutation testing found four tests in 0.3 that passed for the wrong reason, and the coverage
      floor found none of them.
    - No CI, by decision. Run make check before every push; make hook enforces it locally.
    - mf/trial and its golden rows are deleted in E2, not here.
retros:
  - sprint: "0.1"
    doc: docs/plan/retros/0.1-greenfield-skeleton.md
    gates: []
    design_amendments: 4
    headline: >
      The coverage floor changed the design rather than merely measuring it: OOM branches no test
      could reach forced an allocation seam, which turned into a standing OOM sweep. Branch
      coverage 84% -> 92% from that alone.
    carry_over: [ci_decision]
  - sprint: "0.2"
    doc: docs/plan/retros/0.2-memory-process-model.md
    gates: []
    design_amendments: 6
    headline: >
      The 0.1 allocation seam was superseded by its own logic: the seam made out-of-memory branches
      testable, arenas made them nonexistent. A testable failure path beats an untested one, and no
      failure path beats either. The coverage floor also caught two real defects — cache-line
      alignment computed from an offset rather than an address, and a reader over-reserving arena
      that the high-water mark would have made permanent.
    carry_over: [ci_decision]
  - sprint: "0.2.1"
    doc: docs/plan/retros/0.2.1-pool-discipline.md
    gates: []
    design_amendments: 5
    headline: >
      The pool was the one place the design argued against itself: 0.2 spent its length removing
      recoverable environmental failure, then built a pool that ran dry, quietly made another arena
      and incremented a counter nobody read. It now dies like everything else and the orchestrator
      grows the depth. Two 0.2 comments were also wrong and are now proved by static assertion:
      alignof(max_align_t) is 8 here, not 16, and the documented alignment contract was never
      enforced. No defect was found by a failing test this sprint — the floor found dead weight and
      one untestable branch — but a surviving mutation found a weak assertion the branch count could
      not see.
    carry_over: []
  - sprint: "0.3"
    doc: docs/plan/retros/0.3-determinism-harness.md
    gates: []
    design_amendments: 4
    headline: >
      The coverage floor found nothing — a hash and a bump counter barely branch — and mutation
      testing found four tests that passed for the wrong reason, including a shift test that only
      looked in one direction and a fold-order test that changed both sides at once. The CI
      question, deferred twice, is closed: local only, because the build is pinned to one machine
      and a hosted runner would compile a different program. Two mutations survive and are recorded:
      both weaken the digest's internal mixing without changing anything its contract exposes, which
      is the nature of a hash.
    carry_over: []
