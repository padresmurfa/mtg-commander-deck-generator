# ---------------------------------------------------------------------------
# CURRENT SPRINT TASK SPLIT. Replaced wholesale at each sprint planning.
# ---------------------------------------------------------------------------
tasks:
  sprint: "3.2"
  doc: docs/plan/sprints/3.2-objective-sampling.md
  goal: >
    An objective worth optimising - chosen against the degeneracy 3.1 disclosed - plus CVaR
    scalarisation and stratified sampling, so the solo evaluation produces a fitness rather than a
    number that happens to accumulate.
  why_now: >
    3.1 shipped a continuous score and measured it into the ground: it is close to one policy's own
    objective, and G3 failed against it for a reason that is about the model rather than the metric.
    This sprint is titled "Objective & sampling" and the objective is now the thing most in need of
    being chosen deliberately.
  carried_in:
    - >
      Choose an objective that is not any policy's own objective, pre-registered before measurement,
      with the degeneracy check applied. Mana value deployed is close to "spend the most mana
      available", which is what expensive-first optimises.
    - >
      Decide what the solo objective is FOR, now that it cannot measure skill. Section 3 wants
      fitness and section 5 wants a gap, and 3.1 showed those want different instruments.
  input_from_previous_retro:
    - >
      A null-opponent model with a fixed horizon prices position at zero, so every skilled decision
      in section 5's ladder looks like a loss. Do not build an objective that assumes otherwise.
    - >
      The aggregation error is DECK-DIFFERENTIAL: +22% on high curves, -10% on artifact ramp. Any
      objective built on the aggregate phases inherits that bias, and G4 in 3.3 must be read knowing
      it.
    - >
      A gate threshold in standard errors leaves the sample size blank (2.3). Effect size beside
      significance, for G4 too.
    - >
      Pre-registration protects against fitting a metric to the answer, NOT against picking one that
      is degenerate by construction. Check for degeneracy explicitly this time.
  split:
    - id: T1
      name: choose the objective - what it measures, and the degeneracy check that clears it
    - id: T2
      name: per-strategy scalarisation, and what "max over admissible strategies" means in code
    - id: T3
      name: CVaR_10 and mean + lambda*CVaR, sorted and reduced in index order
    - id: T4
      name: stratified openers under Neyman allocation
    - id: T5
      name: the solo gate wired as pass/fail, feeding the fidelity ladder
    - id: T6
      name: known-bad decks (13.3) as the regression suite the objective must not shrug at
    - id: T7
      name: retro and amendments
retros:
  - sprint: "3.1"
    doc: docs/plan/retros/3.1-aggregate-phases.md
    gates: [G3, G1]
    design_amendments: 5
    headline: >
      The sprint existed because 2.3 deferred G3 with an instruction - re-measure against a
      continuous objective - and the measurement says the instruction rested on a false premise. A
      LONGER HORIZON MAKES THE POLICY GAP SMALLER. On the land rule alone the gap runs 1.308 at turn
      4, 0.127 at turn 12 and 0.001 at turn 20, with the forgiving deck at exactly 0.000 throughout
      and the same shape on all six seeds tried - a 19x decay. The careful policy's whole advantage
      is TEMPO and a null-opponent model has NO CLOCK, so being a turn behind costs nothing given
      enough turns. It generalises past sequencing: the mulligan component REVERSES SIGN against a
      12-turn score, because a mulligan costs cards and the early game it buys is priced at zero.
      Every skilled decision in section 5's ladder trades long-run resources for short-run position,
      and this model prices position at zero. So G3 FAILED at -2.28 sigma - and its written failure
      branch, "section 5 is unfounded", was engaged and NOT taken, because section 5 separates the
      decks perfectly at every horizon. What cannot be done is measuring it solo; G3 moves to E5.
      Also disclosed rather than patched: the score it was measured against is close to
      expensive-first's own objective, so pre-registration protected against fitting the metric to
      the answer and not against picking a degenerate one. G1 fell to 0.9301 as three retros
      predicted and for a reason none of them gave - aggregate phases with a null opponent observe
      more TURNS, not more kinds of event, so no reachability rule changed and the inert share went
      marginally UP; what moved it was a recurring trigger classified as a one-shot opcode. Section
      3's exact/aggregate boundary was measured for the first time and HOLDS, once the statistic is
      the relative error rather than the absolute one - but the error is deck-differential at 10-20%,
      which is a bias G4 cannot see. Mutation testing removed a dead untap call that looked like
      diligence and stated a rule the code did not follow.
    carry_over: [objective_choice, what_the_solo_objective_is_for]
  - sprint: "2.3"
    doc: docs/plan/retros/2.3-policies-policy-gap.md
    gates: [G3]
    design_amendments: 5
    headline: >
      G3 DEFERRED, and the reason is a bigger finding than the verdict. The policy gap was decomposed
      because design section 4 asserts the mulligan is "a large part" of it and nothing had tested
      that: it is right, and that turns out to be a problem for section 5. The mulligan is ~88% of
      the gap and is the SAME SIZE on both decks, so it discriminates nothing and nearly cancels in a
      difference of differences; the sequencing component is exactly 0.0000 on the deck with nothing
      to sequence and +0.0123 on the deck built to punish it - a perfect qualitative separation, and
      small. Averaging them dilutes a clean signal with a large constant. The primary metric moved
      0.86 to 0.94 on BOTH decks because section 3 deliberately sets the opening bar low, so the
      right gate for fitness is a poor instrument for a policy gap - the three-way pass/defer/fail
      branch was written down beforehand precisely so this could not be recorded as "no skill signal
      exists". The threshold rule itself was also wrong and is disclosed rather than patched: "5x a
      measured noise floor" is a significance test, a noise floor shrinks as 1/sqrt(N), and the same
      comparison read 1.26 sigma at 500 games a block and 5.32 at 8000. Gates now need an effect size
      too, which no sample size can inflate - and under both criteria the verdict is unchanged at
      every sample size and all eight seeds. Mutation testing found a survivor that was not an
      equivalent mutant but a BETTER policy: taking the expensive ramp first beats curving out,
      because a mana creature is summoning sick and a fetched land is not.
    carry_over: []
  - sprint: "2.2"
    doc: docs/plan/retros/2.2-exact-turns.md
    gates: []
    design_amendments: 5
    headline: >
      The opening phase is real: turns 1-4 exactly, mana as a bipartite matching rather than a count
      per colour, castability decided pip by pip by Hall's condition, and a 13-byte state vector with
      no padding and no float. mf/trial is deleted after carrying the determinism matrix since 0.3,
      and the six-way matrix now runs on the thing that will actually be optimised - with the kept
      hand as the resume state, which is genuinely all a half-finished game carries where the
      stand-in's two integers were chosen to look plausible. The design's named oracle for land drops
      LOOKED wrong - its comment claims a conjunction over turns and its body computes one term - and
      exact rational arithmetic against brute-force enumeration showed it right: exactly one card is
      seen per turn and the requirement rises by one per turn, so the events are nested and the
      conjunction collapses. Checking before accusing is the only reason a plausible complaint did
      not become a wrong fix. Mutation testing did the real work again: 35 mutations, 4 tests
      rewritten for pinning nothing, and two defects - a fetched-land flag that turned out to have no
      observable effect at all, which is only possible if entering the battlefield changes no mana,
      and it did not, so a turn-one Sol Ring paid for nothing behind it. The coverage floor found a
      process defect rather than a code one: run_turn_tests was never registered in the suite, so a
      module whose own tests all passed contributed nothing to make check.
    carry_over: []
  - sprint: "2.1"
    doc: docs/plan/retros/2.1-shuffle-draw-mulligan.md
    gates: [G2]
    design_amendments: 3
    headline: >
      G2 PASSED — worst cell 2.43 sigma against a 5 sigma tolerance that was written down before any
      code ran, because a threshold chosen after seeing the result is not a gate. Two things were
      decided in advance and both mattered: the tolerance, and the fact that G2 covers the shuffle
      and the draw but NOT the mulligan, which is a decision procedure with no closed form. Saying
      so up front avoided the overclaim 1.2.1 spent a sprint unwinding on G1. A 3.19 sigma worst
      cell on a larger sweep was chased across eight seeds rather than accepted — it wandered both
      directions and averaged -0.48 sigma, so noise, and the check was worth it because a
      systematic bias in a shuffler never fails, it just makes every later number wrong the same
      way. The unit suite caught a real defect: with zero samples the standard error is infinite,
      every deviation divides down to zero sigma, and the gate reported agreement it had never
      observed — a gate that passes without measuring anything, two lines from shipping. Also
      recorded: what Tagger was for, since reference/legacy-ts is now one sprint from deletion.
    carry_over: []
  - sprint: "1.3"
    doc: docs/plan/retros/1.3-classes-dominance.md
    gates: []
    design_amendments: 4
    headline: >
      The measurement the sprint existed to take: 29,681 commander-legal representable cards collapse
      to 8,524 equivalence classes and then to 2,698 after dominance chaining — 11x, against a design
      estimate of 2.7x that described a single commander's candidate pool rather than the legal set.
      The same condition G1 carries applies: 90.3% of clauses are inert, so much of the collapse is
      cards becoming "a 2/2 that does nothing observable", and the count will RISE when E3 widens the
      phases. The 32-byte struct carried out of 1.2 turned out to be the prerequisite for everything
      rather than an afterthought, because §7.1 does not class cards BY the struct — the struct IS
      the class; it lands at 20 bytes. Three defects, none found by a test written in advance: a
      dominance roster built in class order rather than preference order, which would have put the
      WORSE card first on expansion; a distinct-count that was 361 million strcmp calls behind a
      comment claiming it was linear; and two wire-format constants that were simply miscounted.
      Mutation testing did the real work — the first dominance pass caught 7 of 11, and every
      survivor was a rule that another rule happened to shadow. The design also described two structs
      as one: it listed oracle_id and name inside a 32-byte budget, which an oracle id alone exceeds.
    carry_over: []
  - sprint: "1.2.1"
    doc: docs/plan/retros/1.2.1-clause-reachability.md
    gates: [G1]
    design_amendments: 3
    headline: >
      An offhand remark that dual lands often enter tapped found the same defect five times: the
      classifier decided a clause from the first effect keyword it recognised and asked whether the
      model could express what it found in one branch out of five. 162 lands entering tapped only
      under a condition were recorded as entering tapped outright; 257 variable cost reductions as
      fixed; and a land fetch was recognised as ramp only when it happened to contain the letters
      l-a-n-d, so "Plains or Island" was ramp and "Mountain or Forest" was a spell tutor. G1
      re-measured at 0.9325, superseding 0.9357 — but 1,454 clauses (2.0%) changed classification
      for that 0.0032 move, a near-cancellation of two large opposite corrections rather than
      evidence the first answer was nearly right. The finding that outlasts the sprint is a hazard
      in the metric itself: G1 rises when LESS is simulated, so the inert share is now quoted beside
      the fraction everywhere. Mutation testing found the Island accident had reappeared as a dead
      || alternative, and three tests that pinned nothing.
    carry_over: []
    addendum:
      what: precon decklists acquired, and two design assumptions corrected
      why: >
        1.3 T6 had been recorded as blocked on precon contents, on the belief that only Moxfield,
        MTGGoldfish and EDHREC held them and all behind HTML meant for humans. MTGJSON publishes
        them as CC0 bulk JSON keyed by scryfallOracleId — the key 1.1 already builds the card set
        around — joining at 16,624 of 16,624 entries. The blocker was an unchecked assumption, not
        a fact, and it was recorded as a blocker without anyone going to look.
      corrections:
        - >
          190 Commander precons exist, not ~68. The ~68 was the count with WIN RATES (67), a
          different and much smaller set; the design carried it as though it were both.
        - >
          The membership bitmask cannot be a per-card field: 190 bits is 24 bytes against a
          32-byte struct budget, the set grows every release, and 83% of cards are in no precon at
          all. It becomes a side table, and T1 gets those bytes back.
        - >
          A precon has one OR TWO commanders — five of the 190 are partner pairs.
      also: >
        spec meta.current_sprint had been stale at "0.2" for five sprints. Corrected, and pointed
        at status.yaml as the authority so it cannot drift again.
  - sprint: "0.1"
    doc: docs/plan/retros/0.1-greenfield-skeleton.md
    gates: []
    design_amendments: 4
    headline: >
      The coverage floor changed the design rather than merely measuring it: OOM branches no test
      could reach forced an allocation seam, which turned into a standing OOM sweep. Branch
      coverage 84% -> 92% from that alone.
    carry_over: [ci_decision]
  - sprint: "0.2"
    doc: docs/plan/retros/0.2-memory-process-model.md
    gates: []
    design_amendments: 6
    headline: >
      The 0.1 allocation seam was superseded by its own logic: the seam made out-of-memory branches
      testable, arenas made them nonexistent. A testable failure path beats an untested one, and no
      failure path beats either. The coverage floor also caught two real defects — cache-line
      alignment computed from an offset rather than an address, and a reader over-reserving arena
      that the high-water mark would have made permanent.
    carry_over: [ci_decision]
  - sprint: "0.2.1"
    doc: docs/plan/retros/0.2.1-pool-discipline.md
    gates: []
    design_amendments: 5
    headline: >
      The pool was the one place the design argued against itself: 0.2 spent its length removing
      recoverable environmental failure, then built a pool that ran dry, quietly made another arena
      and incremented a counter nobody read. It now dies like everything else and the orchestrator
      grows the depth. Two 0.2 comments were also wrong and are now proved by static assertion:
      alignof(max_align_t) is 8 here, not 16, and the documented alignment contract was never
      enforced. No defect was found by a failing test this sprint — the floor found dead weight and
      one untestable branch — but a surviving mutation found a weak assertion the branch count could
      not see.
    carry_over: []
  - sprint: "0.3"
    doc: docs/plan/retros/0.3-determinism-harness.md
    gates: []
    design_amendments: 4
    headline: >
      The coverage floor found nothing — a hash and a bump counter barely branch — and mutation
      testing found four tests that passed for the wrong reason, including a shift test that only
      looked in one direction and a fold-order test that changed both sides at once. The CI
      question, deferred twice, is closed: local only, because the build is pinned to one machine
      and a hosted runner would compile a different program. Two mutations survive and are recorded:
      both weaken the digest's internal mixing without changing anything its contract exposes, which
      is the nature of a hash.
    carry_over: []
  - sprint: "1.2"
    doc: docs/plan/retros/1.2-opcode-model.md
    gates: [G1]
    design_amendments: 3
    headline: >
      G1 passed at 0.9357 against the real pool — and the condition matters more than the number.
      89.4% of clauses are INERT rather than modelled, because the simulated phases are only the
      turn-1-4 feasibility gate; the figure must be re-measured when E3 widens what is observed, and
      it will fall. The first measurement read 0.9249 and was wrong in a way review would have
      missed: 481 dual-land clauses, "{T}: Add {W} or {U}", were being read as fixed {W} — colour
      flexibility on turn two being close to the entire thing the opening phase measures. Found by
      interrogating the data rather than the code, which is the same lesson 1.1 learned about JSONL
      arriving in a different disguise.
    carry_over: [card_struct_32_bytes, unmatched_report]
  - sprint: "1.1"
    doc: docs/plan/retros/1.1-acquisition.md
    gates: []
    design_amendments: 3
    headline: >
      The first sprint that produces something real. Two blocking decisions were
      answered — preprocessing runs in C, and it consumes a bulk file rather than
      fetching one — and design §8 was amended with the superseded paragraph quoted
      rather than rewritten. The coverage floor found two branches a refactor had
      just made unreachable; mutation testing found a rule with no test, which no
      printed card can currently distinguish, so the test that pins it is
      deliberately synthetic. The most useful failure was in a test: a hand-counted
      literal length turned valid input into malformed input and the scanner was
      suspected for a long time first.
    carry_over: []
