# Deck simulator & optimiser — machine-readable specification
#
# Companion to docs/simulator-design.md. That document carries the reasoning; this one
# carries the extracted decisions in structured form: parameters, invariants, schemas,
# and acceptance criteria.
#
# Every entry has a `ref` pointing at the design section that justifies it. If the two
# disagree, the design doc is authoritative for INTENT and this file is authoritative
# for VALUES — reconcile, do not guess.
#
# Status: design. No implementation exists yet.

meta:
  name: mtg-deck-simulator
  binary: mfsim
  status: in_progress
  implementation_started: true
  current_sprint: "0.2"
  authoritative_prose: docs/simulator-design.md
  plan: docs/plan/
  players: 2
  format: commander

# Third-party code. The tool is a single static binary on one machine; a dependency
# it cannot audit is a dependency it should not have.
dependencies:
  policy: none_without_explicit_agreement
  vendored: []
  written_in_tree:
    - id: json
      ref: "retro 0.1"
      why: >
        The plan said "vendored single-header parser". Vendoring means fetching code this project
        has no way to audit, and reader + writer came to ~500 lines. Code we own is code the
        coverage floor can hold.
      limitation: >
        \u escapes cover the BMP only; a surrogate half is rejected as a parse error rather than
        silently mangled. Revisit in E1 if Scryfall data needs it — raw UTF-8 passes through
        untouched either way.
    - id: test_harness
      ref: "retro 0.1"
      why: ~60 lines. Not worth a dependency.
  excluded_from_coverage_floor: ["src/vendor/**"]

# ---------------------------------------------------------------------------
# Target host. Deliberately single-machine; no portability allowances (ref: 10).
# All values measured on the host, not assumed.
# ---------------------------------------------------------------------------
target_host:
  ref: "10"
  machine: Apple M1 Pro
  arch: arm64
  packages: 1              # no NUMA
  cores:
    performance: 8         # 2 clusters x 4
    efficiency: 2
  smt: false               # physicalcpu == logicalcpu
  cache:
    line_bytes: 128        # NOT 64 — x86 padding habits leave false sharing
    p_core:
      l1d_bytes: 131072
      l1i_bytes: 196608
      l2_bytes: 12582912   # shared per 4-core cluster
    e_core:
      l1d_bytes: 65536
      l2_bytes: 4194304
  page_bytes: 16384
  ram_bytes: 34359738368
  thread_affinity_supported: false   # thread_policy_set -> KERN_NOT_SUPPORTED (46)
  toolchain: "clang (Homebrew 21)"
  compile_flags:
    required:
      - "-std=c17"
      - "-O3"
      - "-mcpu=apple-m1"
      - "-fno-fast-math"
      - "-ffp-contract=off"
      - "-Wall"
      - "-Wextra"
      - "-Werror"
      - "-Wshadow"
      - "-Wconversion"       # added sprint 0.1: caught a real sign-conversion defect on day one
      - "-Wsign-conversion"
    forbidden: ["-ffast-math", "-funsafe-math-optimizations"]
    notes: >
      -mcpu is the correct knob on AArch64 (selects scheduling model, not just ISA).
      fast-math and FP contraction are forbidden because they break determinism (ref: 17.1).
  coverage_measurement_caveat:
    added: sprint 0.1
    note: >
      macOS expands snprintf into __snprintf_chk (_FORTIFY_SOURCE), and llvm-cov reports its
      internal branches as "Folded" while still counting them against the total. This puts a
      practical ceiling below 100% branch coverage that no test can lift. It is a measurement
      artifact, not untested code. The 95% floor has ample headroom — do not chase 100%.

# ---------------------------------------------------------------------------
# Hard invariants. Each is testable; each has an acceptance check.
# ---------------------------------------------------------------------------
invariants:
  - id: no_io_in_loop
    ref: "10"
    statement: Zero syscalls per game; O(1) syscalls per generation.
    acceptance: syscall count per generation does not scale with games simulated
    implications:
      - card table loaded once at startup, prefaulted, never re-read
      - no allocation in the hot loop (arena per thread, reused)
      - no logging or progress output per game
      - result buffers per thread, flushed at generation boundaries
      - preprocessing is a separate subcommand; eval path cannot reach the network
      - no database in the loop
      - memoisation cache in memory only

  - id: lock_free_per_game
    ref: "10"
    statement: Zero locks and zero atomics in the per-game path; <=1 atomic per work batch; 1 barrier per generation.
    acceptance: no synchronisation primitive appears on a per-game code path
    scope_note: Applies to the per-game path only. Per-evaluation data is 3-5 orders of magnitude colder.
    implications:
      - counter-based RNG, no shared generator
      - per-thread arenas, scratch, output buffers
      - work distributed by static partition or one fetch_add per BATCH
      - per-thread structures padded/aligned to 128 bytes

  - id: l1_resident_hot_set
    ref: "10"
    statement: The per-thread hot working set fits in L1d.
    acceptance: hot set <= 16 KB (measured budget ~6.3 KB against 128 KB L1d)
    implications:
      - compact per-deck card table built at evaluation start; global table touched once per evaluation, never per game
      - in-simulation card references are uint8 indices 0..99
      - AoS for static per-deck table; SoA for per-game mutable state
      - software prefetch unnecessary

  - id: determinism
    ref: "17"
    statement: >
      Same seed + config + card table produces bit-identical output, regardless of thread
      count, work distribution order, or resume-from-checkpoint.
    acceptance: see validation.determinism_matrix
    implications:
      - reduce in fixed index order, never completion order
      - accumulate in integers; convert to float once, at the end, in fixed order
      - no wall-clock, no pointer values, no hash-map memory-order iteration reaching output
      - memo cache must be value-neutral (ref: 17.2)
    mechanisms:
      added: sprint 0.3
      rng: >
        mf/rng. Counter-based: every value is a pure function of (seed, stream, counter), so no
        draw depends on what was drawn before it or on which worker drew it. Per stream the
        sequence is splitmix64 unchanged; only the starting state is derived from the pair. The
        stream is keyed by WORK ITEM, never by worker — a worker-keyed stream would make the
        output depend on the thread count, which is the bug the invariant exists to prevent.
      bounded_draw: >
        Rejection, not modulo: draws below 2^64 mod n are discarded so that what remains is an
        exact multiple of n. The bias a modulo fold leaves is one value in 2^64 and no sample size
        would ever find it, so mf_rng_reject_below is public and the property is asserted as
        arithmetic instead.
      reduction: >
        mf/reduce. Results are not accumulated while the work runs at all: each item writes its own
        slot, and the reduction happens once at the end in ascending index. Every slot must be
        filled before the reduction is readable — a missing slot is a dropped work item, and a
        slightly-wrong total is how that would otherwise be hidden.
      digest: >
        mf/digest. 128 bits in two lanes, absorbed byte at a time so incremental hashing equals
        one-shot hashing by construction, and big-endian so the value does not depend on the
        machine. Semantic values only, never rendered text.
      layers: [preprocess, opening, solo, gauntlet, run]
      layer_rationale: >
        A divergence says WHERE. The run layer is the other four folded in ascending layer order —
        derived, never written directly, and readable only after the seal.

  - id: crash_tolerance
    ref: "16"
    statement: A crash loses at most the configured checkpoint interval of work.
    acceptance: kill at arbitrary point; resume; run completes with correct digests

  - id: testable_failure_paths
    ref: "retro 0.1, amended retro 0.2"
    added: sprint 0.1
    statement: Every failure path a test cannot otherwise reach gets a seam that makes it reachable.
    rationale: >
      Branch coverage stalled at 84% on out-of-memory branches no test could trigger. The choice was
      to delete the OOM handling or to make it reachable, and the seam won.
    amendment_0_2: >
      The OOM half is superseded. Sprint 0.2 removed the paths instead of injecting into them:
      arena allocation cannot fail, so there is no `if (!ptr)` to reach and mf/alloc.h is gone.
      The rule still governs genuine I/O failure, where the environment really can refuse and the
      code really must respond.
    seams:
      - id: mf_artifact_open_stream
        covers: i/o write failure
        mechanism: a short fmemopen stream fails writes exactly like a full disk
      - id: mf_worker_run(art)
        covers: artifact write and close failure inside a run
        mechanism: pass a pre-opened artifact over a doomed stream
      - id: mf_panic_set_hook
        covers: process death
        mechanism: >
          the hook longjmps out, so a fatal is observable without being fatal to the suite. What it
          cannot cover is the _exit itself; tests/smoke.sh checks that with real processes and real
          exit codes.
      - id: closing the descriptor under a real FILE*
        covers: fflush and fclose failure
        mechanism: >
          fmemopen truncates silently on macOS — a short write reports at the fwrite and nowhere
          else — so flush and close paths need a real fd yanked mid-run.
    rule: >
      Direct libc allocation outside src/arena.c and src/mem.c is a defect. Enforced by
      `make memcheck`.

  - id: fail_fast
    ref: "10"
    added: sprint 0.2
    statement: >
      Environmental failure terminates the process with a distinct exit code and a machine-readable
      report. It is never a value a caller inspects.
    rationale: >
      There is no useful recovery from half an arena in a batch simulator. Handling it produces
      error branches that exist only to be tested and will never fire in anger.
    scope:
      fatal: [out of memory, arena exhausted, pool exhausted, broken internal invariant]
      not_fatal: [missing file, malformed config, unknown subcommand, unimplemented subcommand]
    exit_codes:
      0: ok
      1: the run did not succeed
      2: the command line was wrong
      70: arena exhausted — the report says by how much
      71: the OS refused memory the process genuinely needs
      72: an invariant this code guarantees did not hold
      73: a pool had no arena left to lend — the report says which depth to grow
    stability: >
      The codes cross a process boundary and the orchestrator switches on them. Renumbering is a
      wire-format change, not a refactor.

  - id: arena_allocation
    ref: "10"
    added: sprint 0.2
    statement: >
      All memory comes from bump-allocated arenas supplied by the caller. Nothing is freed
      individually; a frame is released by moving a pointer backwards.
    guarantees:
      - allocation cannot fail, so no caller checks for NULL
      - memory is always zeroed, on first use and after a pop
      - one arena belongs to one thread; there are no atomics in mf/arena
    implications:
      - lifetime is a property of the phase, not of the object
      - use-after-free and leaks are removed by construction, not by sanitiser
      - the per-game path takes memory reserved before the loop started (see no_io_in_loop)
    layout:
      grain_bytes: 16          # not alignof(max_align_t), which is 8 here
      grain_rationale: >
        max_align_t covers the fundamental types. The ones this code will put in an arena —
        __int128, and the NEON vectors sprint 6.3 wants — are extended types it says nothing
        about, and malloc does not stoop to 8 either. arena.c static-asserts that 16 is no weaker
        than alignof(max_align_t), so a port that disagrees fails to compile.
      max_grain_bytes: 128     # equal to the payload alignment; a stronger request is a caller bug
      payload_alignment: 128   # every arena's payload starts on a cache line
    alignment_contract:
      added: sprint 0.2.1
      rule: >
        mf_arena_alloc_aligned's `align` must be a power of two in 1..128. Zero, a non-power-of-two,
        and anything above the payload alignment are broken invariants (exit 72), not shortfalls.
      rationale: >
        Answering alignment in offsets is only sound up to the payload's own alignment, and the
        masking arithmetic is only sound for a power of two. Growing the arena would not make a
        request for 24-byte alignment meaningful, and diagnosing it as a shortfall would send the
        orchestrator relaunching over a defect in the caller.
    pools:
      added: sprint 0.2.1
      statement: >
        A pool holds exactly `depth` arenas, created and zeroed before the first acquire, and never
        creates another. Acquiring from an exhausted pool is fatal (exit 73).
      rationale: >
        A pool that quietly made another arena would be a recoverable environmental failure with an
        unbounded footprint behind it. The depth is a configured size and behaves like every other
        configured size here: too small kills the process, and the orchestrator grows it.
      kinds:
        heap: arenas are returned in any order
        stack: arenas are returned in the exact reverse of the order taken; violating it is exit 72
      kind_rationale: >
        A stack pool can check that a release is the mirror of its acquire, so a frame outliving its
        caller dies at the frame that caused it. A heap pool cannot, so it does not pretend to.
      churn_rule: >
        Acquire at phase boundaries, not inside them. Everything acquiring makes cheap is paid for
        by the release that reset and re-zeroed the arena. mf_pool_acquires is emitted in the run
        artifact so a churning caller is visible rather than merely disapproved of.
      ownership: >
        The pool owns every arena for its whole life, lent or not, so it must outlive its borrowers
        and destroying one mid-flight is safe.
    todo_perf:
      - id: backing_store
        now: one calloc per arena
        later: mmap(MAP_ANON) — kernel-zeroed, so create() stops paying for a memset
        sprint: "6.3"
      - id: pop_zeroing
        now: eager memset of the released range
        later: a dirty watermark zeroed lazily on the next allocation, if a profile ever shows it
      - id: pool_refill
        now: synchronous on release
        later: a background thread keeps the pool stocked
        sprint: "6.1"

  - id: no_popularity_prior
    ref: "7.9"
    statement: The candidate pool is never pruned by EDHREC popularity.
    rationale: >
      The project exists to escape the popularity prior of the legacy PlanScore stack.
      An optimiser restricted to already-popular cards can only rediscover the consensus deck.
    permitted_pruning: [legality, colour_identity, budget, skill_floor, simulator_representability]

# ---------------------------------------------------------------------------
# Tunable parameters. Defaults are the recommendation, not a constraint.
# ---------------------------------------------------------------------------
parameters:

  memory:
    ref: "10"
    added: sprint 0.2
    note: >
      None of these is a specification. Each is a starting guess the worker dies against and the
      orchestrator grows, so they converge over a few runs rather than having to be right up front.
      One capacity sizes every pooled arena: two would need the fatal report to say which arena it
      was, which is a name table between the worker and the orchestrator, and nothing yet needs the
      distinction.
    root_arena_bytes:
      type: size
      value: 1048576          # fixed, not grown: config, paths, the artifact record buffer
      note: Not the size the orchestrator grows. That one is per evaluation.
    arena_bytes:
      type: size
      default: 8388608        # 8 MiB — was 64 MiB until sprint 0.2.1
      min: 65536
      max: 1099511627776      # 1 TiB
      note: >
        The pools are stocked eagerly, so this is multiplied by every depth below it before a run
        does any work. Eight megabytes is as much a guess as sixty-four was; it just does not
        reserve most of a gigabyte to find that out.
    arena_max_bytes:
      type: size
      default: 8589934592     # 8 GiB
      min: 65536
      max: 1099511627776
      constraint: must be >= arena_bytes; checked after the whole document is read
    heap_pool_depth:
      type: int
      default: 2
      min: 1
      max: 256
      note: Arenas returned in any order. Renamed from arena_pool_depth in sprint 0.2.1.
    stack_pool_depth:
      type: int
      default: 4
      min: 1
      max: 256
      note: Arenas returned in the mirror of the order taken.
    pool_max_depth:
      type: int
      default: 256
      min: 1
      max: 256
      constraint: must be >= both depths; checked after the whole document is read
      note: >
        Depth 0 is not permitted. It used to mean "do not pool this"; with exhaustion fatal it would
        mean "acquiring is always fatal", which is a config that can only be a mistake.
    max_relaunch:
      type: int
      default: 4
      min: 0
      max: 16
      note: 0 means run once and report.
    persist_growth:
      type: bool
      default: true
      note: >
        Writes a grown size or depth back to the config file, atomically. Without it, "fixed by the
        next retry" holds only within one invocation and tomorrow's run rediscovers the same numbers
        the same expensive way. Renamed from persist_arena_growth in sprint 0.2.1, since it now
        persists more than an arena size.
    growth_policy:
      ref: "10"
      arena:
        trigger: exit 70 with reason arena_exhausted
        rule: max(need * 1.25, arena_bytes * 2), clamped to arena_max_bytes
        headroom_rationale: >
          `need` covers the one allocation that did not fit, not whatever the run would have gone on
          to want. Sizing exactly to it invites a second death a few allocations later.
      pool:
        trigger: exit 73, with the report's `kind` naming which depth
        rule: max(need, depth * 2), clamped to pool_max_depth
        no_headroom_rationale: >
          A depth is a count of concurrent borrowers, and the doubling already covers the ones the
          report did not see.
        unknown_kind: >
          A kind the orchestrator does not recognise — including the empty kind of a report that
          never arrived — is not grown at all. Guessing would relaunch a run that fails in exactly
          the same place.
      stop_conditions:
        - need above the relevant ceiling
        - already at the relevant ceiling
        - attempts used == max_relaunch

  processes:
    ref: "10"
    added: sprint 0.2
    orchestrator:
      binary: mfsim
      owns: [config resolution, worker launch, growth decisions, config write-back]
      never: [simulation]
    worker:
      binary: mfsim-worker
      owns: [the run]
      never: [spawning, retrying, recovering]
      note: >
        Being a separate process is what makes "give up and be relaunched larger" coherent rather
        than a euphemism for catching your own out-of-memory.
    discovery: >
      The worker path is derived from the orchestrator's argv[0] so the pair travels together and
      neither depends on the working directory. MF_WORKER overrides.
    control_files:
      resolved_config: written before every launch; passed as --config
      fatal_report: written by the dying worker; passed as --report
      location: $TMPDIR (default /tmp), named with the pid
      determinism_note: >
        Transient control files, not output. Nothing derived from them reaches an artifact, so the
        pid in their names costs the determinism invariant nothing.
    single_process_mode: >
      `mfsim --no-spawn` runs the work in one process. Nothing is retried there — a worker that
      cannot ask for a bigger arena is a worker that dies with the report and stops.

  concurrency:
    threads:
      ref: "10"
      type: int
      default: 4
      min: 1
      max: 8
      note: Never exceed performance core count. Never schedule onto E-cores.
    qos_class:
      ref: "10"
      type: enum
      default: QOS_CLASS_USER_INITIATED
      note: >
        Biases toward P-cores; cannot pin (affinity unsupported). Set explicitly rather
        than inheriting the launching shell's class.

  objective:
    ref: "3"
    formula: "mean + lambda * CVaR_10"
    lambda:
      type: float
      default: 0.5
      note: >
        A large lambda is expensive in a way the formula does not reveal — CVaR_10 uses the
        bottom decile only, so its effective sample size is ~n/10 (ref: 15.5).
    cvar_quantile:
      type: float
      default: 0.10
    forbidden_alternatives:
      - id: minimax
        why: >
          Degenerates. Every deck's worst case is "mulligan to four, no lands, opponent has
          the nuts"; they are all equally bad, so the objective discriminates nothing.
      - id: adversarial_over_opponent_hands
        why: Turns each evaluation into a game-tree search; forfeits the tractability win.

  adaptive_sampling:
    ref: "15"
    method: group_sequential
    block_size:
      type: int
      default: 32
      note: Check at block boundaries, not continuously. Batches align with threading.
    critical_note: >
      Fixed-alpha tests with repeated peeking do NOT give the nominal error rate
      (optional-stopping fallacy). Use an anytime-valid procedure: empirical-Bernstein
      confidence sequence, SPRT, or group-sequential with alpha spending.
    stages:
      - id: screening
        alpha: 0.20
        min_effect_pp: 5
        max_games: 100
        note: Loose is correct, not sloppy — a wrongly promoted candidate meets a stricter test next stage.
      - id: selection
        alpha: 0.05
        min_effect_pp: 2
        max_games: 1000
      - id: elite_promotion
        alpha: 0.01
        min_effect_pp: 1
        max_games: 4000
    required_parameters_note: >
      alpha alone is not a stopping rule. Two equal candidates never separate at any sample
      size, so min_effect (declare a tie below it) and max_games (hard cap) are mandatory.

  variance_reduction:
    ref: "7.3, 7.8"
    stratification:
      variable: opening_hand_land_count
      strata: [0, 1, 2, 3, 4, 5, 6, 7]
      allocation: neyman        # proportional to (stratum probability x within-stratum stddev)
      do_not_truncate: true
      why: >
        Extreme strata become MULLIGANS, and mulligan rate is a primary consistency signal.
        Truncating deletes exactly that difference. Neyman allocation starves them naturally
        because their outcome is nearly determined, while keeping the estimator unbiased.
    common_random_numbers:
      enabled: true
      note: Same shuffle seeds, gauntlet, and play/draw split per generation; run each matchup on the play and on the draw with mirrored seeds.
      expected_saving: "3-5x fewer samples"
    racing:
      enabled: true
      note: Successive halving — all candidates get a short budget, bottom half dies, survivors continue.

  genome:
    ref: "7.1, 7.6"
    representation: integer_vector_over_metacard_classes
    length_approx: 150
    element_bounds: "0..class_size"
    sum_constraint: 99
    note: >
      NOT a 400-bit vector with a cardinality constraint. Singleton means a class carries a
      multiplicity (you may run Llanowar AND Fyndhorn AND Elvish Mystic), so the element is a
      count bounded by class size. Swapping functionally identical cards becomes a no-op in
      the search space, as it is in the game.
    crossover:
      method: package_aware
      unit: connected components of the deck's lift/synergy graph
      why: >
        Deck fitness is highly epistatic — combos are pairs and triples, and uniform crossover
        shreds them. Without package-aware crossover, simulated annealing over the swap
        neighbourhood beats the GA and the GA has no reason to exist.

  budget:
    ref: "7.5"
    total_cost_constraint: hard
    sampling_weight: log_price
    price_distribution: heavy_tailed_lognormal
    cost_model: min_over_acquisition_paths
    cost_formula: |
      cost(deck) = min(
        sum(min_single_price(c) for c in deck),
        min over precons P of [ price(P) + sum(min_single_price(c) for c in deck \ P) ]
      )
    note: >
      Direction varies by precon and must be computed, not assumed. A precon with a valuable
      reprint can exceed its retail price in singles; a weak precon's singles may total well
      under retail. min() handles both.

# ---------------------------------------------------------------------------
# Skill brackets. Drives policy set, colour bound, search radius, budget, output size.
# ---------------------------------------------------------------------------
brackets:
  ref: "5"
  measurement:
    method: policy_gap
    definition: >
      Skill requirement = performance delta between the deck run under a naive policy and
      under the best available policy. Measured, not estimated from card features.
    optimise_under: target_bracket_policy
    optimise_under_note: >
      NOT the best policy. Optimising an average-player deck with a professional policy
      produces a deck that player cannot pilot.
  levels:
    - id: noob
      policies: [greedy]
      colours_max: 1
      mutation_radius: 5
      budget_anchor: lowest
      decks_returned: 1
      seed_from: precon
      selection_criterion: most_forgiving
    - id: beginner
      policies: [greedy, curve-out]
      colours_max: 2
      mutation_radius: 12
      budget_anchor: low
      decks_returned: 2
      seed_from: precon
      selection_criterion: most_forgiving
    - id: average
      policies: [curve-out, role-aware]
      colours_max: 2
      mutation_radius: 25
      budget_anchor: edhrec_avg
      decks_returned: 4
      seed_from: edhrec
      selection_criterion: balanced
    - id: experienced
      policies: [role-aware, sequencing-aware, hold-interaction]
      colours_max: 3
      mutation_radius: 45
      budget_anchor: above_avg
      decks_returned: 8
      seed_from: edhrec
      selection_criterion: diverse
    - id: professional
      policies: [all]
      colours_max: 5
      mutation_radius: null      # unbounded
      budget_anchor: cedh
      decks_returned: 0          # reference tier only, never shipped
      seed_from: cedh
      selection_criterion: diverse
      note: >
        Retained solely as the upper reference point for the policy-gap measurement.
        Without it the skill requirement cannot be computed.
  axis_separation_warning:
    ref: "5"
    statement: mutation_radius and measured skill are SEPARATE axes that merely correlate.
    why: >
      EDHREC decks are built by average players for 4-player pods and are not skill-stratified.
      Some very popular commanders are hard to pilot. "Close to EDHREC" is not "easy to play".
      A 3-mutation deck measuring as high-skill must be rejected from the noob bracket.
  colour_bound_scope:
    note: >
      Colour identity is fixed by the commander. This constrains GAUNTLET GENERATION and
      COMMANDER SELECTION, not the optimisation of a deck the user already owns.

policies:
  ref: "4"
  identity: strategy_is_policy
  note: >
    Not a label annotating results plus a separate implementation. Running deck D under
    strategy S MEANS simulating D with policy S.
  set: [greedy, curve-out, role-aware, sequencing-aware, hold-interaction, combo-assemble]
  must_include:
    - mulligan_rule       # keep/mull judgment is policy-owned; a large part of the skill gap
    - london_bottom_rule  # which N to bottom after a mulligan is itself a policy decision
  commander_handling:
    always_available: true
    model_commander_tax: true
    note: Commander is a fixed anchor, not a draw. Tax expresses the cost of it being answered.
  output_shape: matrix        # (deck x strategy) -> performance, NOT a scalar
  fitness_reduction: max_over_admissible_strategies

# ---------------------------------------------------------------------------
# Phases. Exact early, aggregate late.
# ---------------------------------------------------------------------------
phases:
  ref: "3"
  list:
    - id: opening
      turns: "1-4"
      simulation: exact
      why_exact: >
        Turns 1-4 are pure sequencing (which land first, tapland timing, ramp before payoff).
        Aggregating destroys exactly what this phase is meant to measure. Also cheap.
      role: gate_only
      contributes_to_fitness: false
      gate_note: >
        Binary feasibility gate with a LOW bar, threshold conditional on the strategy under test.
        Weighting opening strength in fitness would breed out every late-game archetype.
    - id: development
      turns: "5-7"
      simulation: aggregate
    - id: execution
      turns: "8+"
      simulation: aggregate

fidelity_ladder:
  ref: "9"
  note: Each stage passes only the top X% upward.
  stages:
    - id: opening_gate
      cost_per_eval: 1us
      role: feasibility pass/fail
    - id: aggregate_solo
      cost_per_eval: 10us
      role: bulk GA fitness
    - id: full_solo
      cost_per_eval: 100us
      role: elite refinement
    - id: versus_gauntlet
      cost_per_eval: 1ms
      role: bracket-relative fitness
    - id: forge
      cost_per_eval: 10s
      role: validation of final top-K only
      critical_note: >
        Forge is NEVER the fitness function. A GA pointed at Forge's AI produces a deck tuned
        to beat Forge's AI — reward hacking, not deck quality. It sees ~10k games, not 2.5M.
  estimated_total: "~25 ms per deck evaluation; pop 100 x 200 generations ~ single-digit minutes on one core"

gauntlet:
  ref: "6"
  matchup_rule: same_bracket_plus_minus_1
  why: A beginner does not beat a professional absent extraordinary luck; modelling it wastes compute.
  fitness_scope: bracket_relative
  fitness_scope_warning: >
    62% in the beginner bracket and 62% in the experienced bracket are NOT the same number.
    Nothing downstream may average or rank across brackets.
  holdout: true
  holdout_note: Test gauntlet the GA never sees. Train climbs but test does not => overfitting, now visible.
  coevolution: deferred
  coevolution_note: More robust but a moving fitness target and much harder debugging. Start fixed.

# ---------------------------------------------------------------------------
# Preprocessing. Runs weekly, not per evaluation.
# ---------------------------------------------------------------------------
preprocessing:
  ref: "8"
  added: sprint 1.1
  language: c
  language_rationale: >
    Design §8 originally specified Node, because a Node app existed around the project. Sprint 0.1
    replaced it with a C CLI, so the only argument for a second toolchain went with it. A second
    toolchain is a second thing to install, pin and keep deterministic.
  acquisition:
    fetches: false
    rationale: >
      The card table is an input to a deterministic core, so a subcommand that downloaded would be
      a subcommand whose output depended on the day it ran. Fetching is one documented command run
      outside the tool.
    invocation: "mfsim preprocess --bulk <file> --game <paper|arena|mtgo>"
    game:
      required: true
      default: none
      rationale: >
        Paper, Arena and Magic Online are different card sets — 37,553, 16,223 and 30,950 cards on
        the 2026-08-09 export, with 976 existing only on Arena and 22,306 only off it. Choosing one
        silently would answer a question that belongs to whoever is building the table.
      price_field:
        paper: usd
        mtgo: tix
        arena: none — Arena has no economy, so the table is priceless by construction
      not_offered: >
        Scryfall also labels 22 printings `sega` and `astral`. A card pool nobody can build a deck
        from is not a card pool.
      measured:
        paper: {cards: 37553, printings: 107337, priced: 33704}
        mtgo: {cards: 30950, printings: 67847, priced: 30598}
        arena: {cards: 16223, printings: 21418, priced: 0}
    source: "Scryfall default-cards bulk export"
    format: JSONL, one card object per line
    format_note: >
      Corrected sprint 1.1. The design said "one JSON array", which is what it used to be; the
      bulk-data descriptor now offers only jsonl_download_uri. The reader decides the framing from
      the first byte and accepts either.
    decompression: >
      Part of the fetch, not part of the tool. Reading gzip would mean a third-party library for a
      step one shell command already does.
    measured:
      date: 2026-08-09
      records: 116694
      bytes: 624000000
      paper_printings: 107337
      other_game_printings_dropped: 9357   # for a paper table
      cards: 37553                          # for a paper table
      rejected: 0
      legality_disagreements: 0
      arena_converged_bytes: 16777216
      wall_clock_seconds: 4.6
  reading:
    strategy: one value at a time, framing detected from the first byte
    rationale: >
      The bulk export is 116,694 records and 595 MB. Parsing it into a document would cost gigabytes
      for a result read once, field by field.
    peak_memory: one card object plus the accumulating card set
    mechanism: >
      A buffered, string-aware scanner finds each element's extent; the ordinary parser reads that
      one element into a stack frame, which is popped once the fields are out.
  oracle_normalisation:
    key: oracle_id
    key_fallback: >
      card_faces[0].oracle_id, and likewise for type_line. The `reversible_card` promos carry
      neither at the top level; both faces name the same oracle, so face zero is unambiguous.
    rule: printings are never entities
    price:
      unit: integer cents
      unit_rationale: >
        Prices arrive as decimal strings. Cents are exact, order-independent to sum, and sidestep
        float comparison in a pipeline whose whole point is bit-identical output.
      minimum_over: paper-legal non-foil printings
      absent: left absent and flagged; imputation is sprint 1.3, not a guess here
    colour_identity: union across printings
    commander_legality:
      rule: legal if any paper printing says legal
      disagreement: counted and reported in the run artifact, never silently resolved
      rationale: >
        Scryfall reports legality per printing but it is a property of the oracle card, so a
        disagreement is a stale record rather than a real distinction. Being permissive is the
        lower-risk error while G1 is a coverage question.
  emission:
    order: ascending oracle_id
    order_rationale: >
      Input order must not reach the output. Sorting on a unique key gives a total order whatever
      the sort algorithm does.
    format_now: JSONL, inspectable
    format_later: flat binary card table (sprint 1.3)
    digest: the set is fed to the preprocess digest layer — the first real data through the harness

# ---------------------------------------------------------------------------
# Data schemas.
# ---------------------------------------------------------------------------
schemas:

  card_struct:
    ref: "8, 10"
    size_target_bytes: 32
    size_hard_cap_bytes: 64
    size_rationale: >
      A real budget on the opcode encoding, not an aspiration. At 32 B a 99-card deck table is
      ~3.1 KB (25 cache lines) and stays L1-resident. At 128 B the table stops being free.
    fields:
      - oracle_id
      - name
      - colour_identity
      - cmc
      - mana_cost
      - type
      - opcode_struct          # effects, produced mana, P/T
      - equivalence_class_id   # post dominance-chaining
      - class_multiplicity_limit
      - dominance_edges
      - min_price              # imputed where absent
      - price_imputed_flag
      - skill_floor
      - commander_legal
      - precon_membership_bitmask

  side_tables:
    ref: "8, 13.2"
    note: Hand-maintained, date-stamped, content-hashed with the rest.
    tables:
      - id: precon_prices
        rows: 68
        source: manual
        why_manual: Scryfall prices singles, not sealed product.
      - id: precon_win_rates
        rows: 67
        source: "playgroup.gg (manual transcription; no API or bulk export)"

  checkpoint:
    ref: "16.3"
    contents:
      - generation_number
      - resolved_config
      - population_genomes
      - elite_set
      - elite_reevaluation_history   # must survive, or elites reset to lucky scores on resume
      - rng_counter                  # entire random state; counter-based RNG (ref: 14.1)
      - card_table_hash
      - per_deck_best_strategy       # strategy inheritance (ref: 7.8)
    excluded:
      - id: fitness_memo_cache
        why: It is a cache. Rebuilding costs repeated work; persisting risks drift against the card table.
    write_protocol: [write_temp, fsync, rename]   # rename is atomic on APFS
    write_protocol_note: Never overwrite in place — a crash mid-write would destroy both copies.
    retain_count: 3
    trigger:
      primary: generation_boundary
      note: A generation is seconds, not minutes, so this loses seconds — well inside the 5-minute requirement.
      safety_valve:
        condition: generation exceeds wall-clock budget
        action: checkpoint mid-generation at a batch boundary
        max_work_loss_seconds: 300
    resume_validation:
      card_table_hash_must_match: true
      on_mismatch: refuse
      override_flag_required: true
      why: >
        Prices move weekly. Silently resuming against a changed table means the second half of
        the run optimises a different objective than the first.

  run_artifact:
    format: jsonl
    append_only: true
    flush: generation_boundary
    must_contain: [resolved_config, card_table_hash, digests]
    note: >
      Deliberately not a database — a write per evaluation would violate no_io_in_loop, and a
      CLI that requires a database to run is a CLI people stop using.

# ---------------------------------------------------------------------------
# Determinism digests + regression testing.
# ---------------------------------------------------------------------------
digests:
  ref: "17.3"
  hashed_over: semantic_output      # fitness values, deck contents, decisions
  not_hashed_over: jsonl_text       # carries timestamps and paths
  layers:
    - id: preprocess
      covers: card table, classes, dominance chains, prices
    - id: opening
      covers: phase-1 gate results over fixture decks
    - id: solo
      covers: full solo evaluation
    - id: gauntlet
      covers: versus-opponent results
    - id: run
      covers: final population and rankings
  rationale: >
    Layered rather than monolithic so a mismatch localises the change. A PR touching the mana
    solver should move `solo` and `run` while leaving `preprocess` and `opening` untouched.
  golden_policy:
    frozen: false
    workflow: >
      A genuine model change SHOULD move digests. If a PR moves a digest, the PR updates the
      golden value and states why in its description. A PR that moves a digest silently is the
      exact failure this catches. The value is that changes are acknowledged, not prevented.

# ---------------------------------------------------------------------------
# Validation. The largest unmitigated risk is a wrong simulator, confidently reported.
# ---------------------------------------------------------------------------
validation:
  ref: "13, 17.4"

  analytic_ground_truth:
    ref: "13.1"
    note: Exact expected values, not plausible ones. Reference impls exist in the legacy TypeScript.
    assertions:
      - opening-hand land distribution converges to hypergeometric
      - P(all land drops through turn T) matches computeLandDropProbabilities
      - mulligan rate at a given keep rule matches closed form
      - P(>=1 of K specific cards by turn T) matches closed form

  precon_fixtures:
    ref: "13.2"
    corpus_size: 67
    corpus_games: ~11700
    source: playgroup.gg
    method: spearman_rank_correlation
    do_not: fit_absolute_win_rates
    filters:
      min_games_per_precon: 100
    caveats:
      - "Data is 4-player-normalised; this simulator is 2-player. Ordinal transfer plausible, cardinal not."
      - "Per-precon n ranges ~40-310. At n=41 a 36% win rate carries roughly +/-15pp — rank barely determined."
    why_precons: [fixed_and_citable, measured_outcomes, intra_cycle_balance_is_a_design_goal, known_power_drift]

  synthetic_known_bad:
    ref: "13.3"
    note: Precons cover only the plausible band. These are the cases no data source contains.
    cases:
      - 20 lands
      - 60 lands
      - curve topping out at 8 with no ramp
      - five-colour version of a mono-colour spell suite on a bad mana base
      - $30 build vs $2000 build of the same commander

  opcode_coverage:
    ref: "13.5"
    type: go_no_go
    run_when: first_slice
    metric: fraction of a real commander's candidate pool representable by the opcode set
    thresholds:
      sound: ">= 0.60"
      compromised: "<= 0.30"
    why: >
      Unrepresentable cards are excluded, so coverage is a hard ceiling on how meaningful the
      output is. At 30% the "optimal" deck is an artefact of what happened to be modellable.
      A couple of hours of work that can invalidate months.

  determinism_matrix:
    ref: "17.4"
    fixture: "5 generations, small population, fixed seed"
    axes:
      thread_count: [1, 4, 8]
      execution: [fresh, resumed_from_generation_3]
    combinations: 6
    requirement: all combinations produce identical digests
    catches: [reduction_order_bugs, hidden_state, unserialised_counters, thread_order_dependencies, cache_induced_variation]
    status:
      added: sprint 0.3
      running_against: >
        mf/trial — a stand-in evaluation with no game semantics (shuffle, draw, add) that has the
        SHAPE of the real thing: per-item streams, out-of-order collection, index-ordered
        reduction, layered digests, a resumable cursor. It exists to be deleted when E2 produces a
        real opening phase.
      thread_axis: >
        Threading arrives in sprint 6.1, so the axis is exercised by partitioning the work the way
        a thread pool would and visiting the partitions last-first. The point is to prove the
        digest is invariant to partition order, which is where the bug would be.
      resume_axis: >
        A checkpoint taken mid-item, carrying the result so far and the RNG counter and nothing
        else. Tested at every boundary from 0 to items, not only at the halfway mark.

  golden_digests:
    ref: "17.4"
    added: sprint 0.3
    file: tests/golden/validate.txt
    contents: the five layer digests plus the trial totals, one per line, in layer order
    compared_by: make golden-check, part of make check
    updated_by: make golden
    update_rationale: >
      Deliberately a separate command. A harness that refreshed its own expectation on failure
      would agree with every change ever made, including the wrong ones.

  opcode_coverage:
    ref: "13.5"
    added: sprint 1.2
    gate: G1
    threshold: {sound: 0.60, compromised: 0.30}
    measured:
      value: 0.9357
      date: 2026-08-09
      pool: commander-legal paper cards from the Scryfall export
      representable: 29783
      legal: 31829
      verdict: pass
    definition: >
      A card is representable when everything it does THAT THE SIMULATED PHASES CAN OBSERVE is
      modelled. The opening phase (design §3) simulates turns 1-4 and asks whether a deck can cast
      its spells and reach turn 5 functional, so the observables are mana produced, cost, cards
      drawn, lands fetched and cost reduction. A vanilla creature is fully representable: a cost, a
      colour requirement and a body is all of it that turn four can see.
    condition: >
      MUST be re-measured when a later epic widens what is simulated. 89.4% of clauses are inert
      rather than modelled, and inertia is relative to the phases being run. The figure will fall
      as the model widens; that is expected and is not a regression. Quoting it bare answers a
      different question than the one it was measured for.
    clause_mix:
      total: 77348
      inert: 69169
      unmatched: 2392
    largest_lever: >
      Conditional and triggered draw — "If you do, draw a card" and its relatives — is the head of
      the unmatched distribution by a wide margin. Past the top ten shapes the tail is essentially
      unique, so the remaining work is diminishing rather than blocked.

  self_consistency:
    ref: "13.4"
    assertion: end-of-opening score correlates with end-of-game outcome within the simulator
    caveat: Necessary, not sufficient. Does not prove correctness — only internal agreement.

# ---------------------------------------------------------------------------
# Power management (macOS specific).
# ---------------------------------------------------------------------------
power:
  ref: "10"
  prevent_sleep:
    supported: true
    api: IOPMAssertionCreateWithName
    type: kIOPMAssertionTypePreventUserIdleSystemSleep
    header: IOPMLib.h        # present in installed SDK
    alternative: "caffeinate -i"
  force_low_power_mode_off:
    supported: false
    why: LPM is a user setting with no app-facing override. Do not attempt.
  low_power_mode_detection:
    check_at: generation_boundary
    sources: ["pmset -g (field: lowpowermode)", "NSProcessInfo.isLowPowerModeEnabled"]
    on_detected:
      - finish current generation and checkpoint
      - print explanatory message
      - release sleep assertion
      - pause
    poll_backoff:
      initial_seconds: 30
      multiplier: 2
      max_seconds: 300
    why_pause_not_continue: >
      An LPM run is not merely slower — it is slower by a large unstated factor, which corrupts
      any wall-clock figure recorded in the artifact. Crashing would be worse: the work is fine,
      the machine's power policy simply changed.
  power_source_check:
    at: startup
    api: IOPSGetProvidingPowerSourceType
    on_battery: warn_only

# ---------------------------------------------------------------------------
# Build order. First slice is deliberately small and contains a kill-switch.
# ---------------------------------------------------------------------------
build_order:
  ref: "12"
  steps:
    - id: first_slice
      scope: turns 1-4 exact, stratified openers with Neyman allocation, one deck, two policies (naive + careful)
      output: two performance numbers and their gap
      tests:
        - a phase-end state is evaluable at all
        - the policy gap separates known-forgiving from known-demanding decks
        - opcode coverage go/no-go
    - id: greedy_baseline
      before: genetic_algorithm
      method: rank pool by marginal contribution, take top 99, backward-eliminate
      why: >
        Deck construction is roughly submodular, so greedy has approximation guarantees and runs
        in a fraction of the time. It is also the control experiment: if the GA cannot beat greedy,
        either the landscape is too noisy for population methods or the crossover preserves
        nothing. Worth learning in an afternoon rather than after a week of tuning.
    - id: genetic_algorithm
    - id: forge_validation
      optional: true

deferred:
  ref: "11"
  note: Not v1 unless trivially cheap. Do in order; stop when profiling says the next is not worth it.
  gpu_offload: removed_out_of_scope_for_this_target
  steps:
    - id: soa_branch_free_autovectorisation
      expected: most of the available win, free
    - id: thread_pool
      expected: near-linear
      before: hand_written_simd
    - id: neon_intrinsics
      batch_width: 16          # 128-bit / uint8 indices
      applies_to: aggregate phases only
      does_not_apply_to: exact turn-by-turn opening (branchy, vectorises poorly)
